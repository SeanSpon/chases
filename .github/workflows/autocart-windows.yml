name: AutoCart Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check scripts
        run: npm run check
      - name: Run unit, desktop lifecycle and real-browser checkout tests
        run: npm test
      - name: Build Windows installer without implicit publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCart-Windows-Installer
          path: |
            dist/AutoCart-Setup-*.exe
            CHASE-START-HERE.txt
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoCart-Windows-Installer
          path: installer
      - name: Publish installer to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "autocart-build-$RUN_NUMBER" installer/dist/*.exe installer/CHASE-START-HERE.txt --target "$COMMIT" --title "AutoCart Windows — build $RUN_NUMBER" --latest --notes "AutoCart 0.2.0 for Windows. Download AutoCart-Setup-0.2.0.exe below. Adds multiple-link entry, in-app directions, click-to-select checkout setup, dry-run testing, opt-in Playwright automatic orders, persistent budget/quantity reservations and duplicate-order locks. Watch-only spends nothing; enabled auto-buy can charge a saved store payment method. Store-specific setup is required; no live retailer has been certified. CAPTCHA/login/verification are not bypassed. Chrome or Edge required. Installer is unsigned."

